<body>
<style>
/* Layout: app móvil por pantallas (portada → partido → preguntas → resultado → detalle / votar), centrada en escritorio.
   Color: neutros puros (sin tono, a*=b*=0) para no evocar a ningún partido. Sí / No / Abstención se distinguen por luminosidad y forma:
   Sí = bloque negro relleno · No = blanco con borde negro · Abstención = gris claro. */
:root{
  --bg:#EDEDED; --surface:#FFFFFF; --ink:#111111; --muted:#595959; --line:#D4D4D4; --tint:#E4E4E4;
  --hero:#111111; --on-hero:#FFFFFF; --on-hero-muted:#BDBDBD;
  --yes:#111111; --yes-ink:#FFFFFF; --no:#FFFFFF; --no-ink:#111111; --abs:#D9D9D9; --abs-ink:#3D3D3D;
  --display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --body:'Public Sans','Segoe UI',system-ui,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0E0E; --surface:#1B1B1B; --ink:#F2F2F2; --muted:#A8A8A8; --line:#333333; --tint:#2A2A2A;
  --hero:#F2F2F2; --on-hero:#111111; --on-hero-muted:#4A4A4A;
  --yes:#F2F2F2; --yes-ink:#111111; --no:#1B1B1B; --no-ink:#F2F2F2; --abs:#3A3A3A; --abs-ink:#D0D0D0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E0E; --surface:#1B1B1B; --ink:#F2F2F2; --muted:#A8A8A8; --line:#333333; --tint:#2A2A2A;
  --hero:#F2F2F2; --on-hero:#111111; --on-hero-muted:#4A4A4A;
  --yes:#F2F2F2; --yes-ink:#111111; --no:#1B1B1B; --no-ink:#F2F2F2; --abs:#3A3A3A; --abs-ink:#D0D0D0; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:480px;min-height:100%;margin:0 auto;padding:20px 16px 32px;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;gap:20px}
@media (prefers-reduced-motion:no-preference){.screen.enter{animation:in .35s ease both}}
@keyframes in{from{transform:translateY(10px)}to{transform:none}}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:800;letter-spacing:-.01em}
p{margin:0}
a{color:var(--ink);font-weight:700;text-underline-offset:3px;text-decoration-thickness:2px}
button{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Portada */
.hero{background:var(--hero);color:var(--on-hero);border-radius:28px;padding:30px 24px 26px;display:flex;flex-direction:column;gap:16px}
.mark{font-family:var(--display);font-weight:900;font-stretch:118%;font-size:clamp(42px,12.5vw,68px);line-height:.95;letter-spacing:-.02em;white-space:nowrap}
.hero p{font-size:19px;font-weight:600;max-width:30ch;color:var(--on-hero)}
.verbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.verb{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;background:var(--surface);border:2px solid var(--ink)}
.verb b{font-family:var(--display);font-weight:800;font-size:19px}
.verb span{font-size:14px;color:var(--muted)}
.facts{display:flex;justify-content:space-around;text-align:center;background:var(--surface);border-radius:var(--r);padding:16px 8px}
.facts b{display:block;font-family:var(--display);font-weight:900;font-stretch:112%;font-size:30px;color:var(--ink)}
.facts span{font-size:13px;color:var(--muted)}

.cta{min-height:58px;border:0;border-radius:16px;background:var(--ink);color:var(--surface);font:800 18px/1 var(--body);cursor:pointer;padding:0 24px;width:100%}
.cta:disabled{opacity:.3;cursor:default}
.ghost{min-height:48px;border:2px solid var(--ink);border-radius:14px;background:transparent;color:var(--ink);font:700 16px/1 var(--body);cursor:pointer;padding:0 18px}
.link{border:0;background:none;color:var(--ink);font:700 15px var(--body);cursor:pointer;padding:8px 0;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:8px}

/* Barra superior */
.top{display:flex;align-items:center;gap:12px}
.back{width:44px;height:44px;flex:0 0 44px;border-radius:12px;border:0;background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.prog{flex:1;height:8px;border-radius:4px;background:var(--surface);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);border-radius:4px}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .3s ease}}
.count{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}

/* Elegir partido */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 15px/1 var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}

/* Pregunta */
.qcard{background:var(--surface);border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;align-items:center;gap:12px}
.ico{width:52px;height:52px;flex:0 0 52px;border-radius:14px;display:grid;place-items:center;background:var(--tint)}
.ico svg{width:28px;height:28px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.topic{font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.qtext{font-family:var(--display);font-weight:700;font-size:clamp(23px,6vw,27px);line-height:1.22}
.more{border:0;background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;text-align:left;font:600 15px/1.45 var(--body);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.more span:first-child{font-weight:800;text-decoration:underline;text-underline-offset:3px}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{min-height:62px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:800 18px/1 var(--body);cursor:pointer;display:flex;align-items:center;gap:14px;padding:0 18px}
.ans svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){.ans:hover{border-color:var(--ink)}}
.ans[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.imp{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:14px 16px;font-weight:700;cursor:pointer}
.imp input{width:22px;height:22px;accent-color:var(--ink)}
.imp small{display:block;font-weight:400;color:var(--muted);font-size:13px}

/* Resultado */
.winner{background:var(--hero);color:var(--on-hero);border-radius:28px;padding:26px 24px;display:flex;flex-direction:column;gap:6px}
.winner .lbl{font-weight:700;color:var(--on-hero-muted)}
.winner .pname{font-family:var(--display);font-weight:900;font-stretch:112%;font-size:clamp(38px,11vw,52px);line-height:1}
.winner .pname.many{font-size:26px;line-height:1.2}
.winner .pp{font-family:var(--display);font-size:24px;font-weight:600}
.card{background:var(--surface);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.rank{display:flex;flex-direction:column;gap:12px}
.rrow{display:grid;grid-template-columns:24px 1fr auto;gap:4px 10px;align-items:center}
.rrow .n{font-family:var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.rrow .nm{font-weight:800}
.rrow .nm small{font-weight:700;color:var(--surface);background:var(--ink);font-size:11px;margin-left:6px;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.rrow .pc{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.rrow .bar{grid-column:2 / 4;height:10px;border-radius:5px;background:var(--tint);overflow:hidden}
.rrow .bar i{display:block;height:100%;border-radius:5px;background:var(--muted)}
.rrow.first .bar i{background:var(--ink)}
.rrow.mine .bar i{background:repeating-linear-gradient(135deg,var(--ink) 0 4px,var(--muted) 4px 8px)}
.mirror{background:var(--surface);border:3px solid var(--ink);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px}
.mirror h3{font-size:22px}
.cmp{width:100%;border-collapse:collapse;font-size:15px;background:var(--surface)}
.cmp th{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 8px;text-align:center}
.cmp th:first-child,.cmp td:first-child{text-align:left;padding-left:0}
.cmp td{padding:10px 8px;border-top:1px solid var(--line);text-align:center;font-weight:700;line-height:1.3}
.cmp th:not(:first-child),.cmp td:not(:first-child){width:74px}
.tag{display:inline-block;min-width:46px;padding:4px 8px;border-radius:999px;font-size:13px;font-weight:800;border:2px solid var(--ink)}
.tag.S{background:var(--yes);color:var(--yes-ink)} .tag.N{background:var(--no);color:var(--no-ink)} .tag.A{background:var(--abs);color:var(--abs-ink);border-color:transparent}
.refine{border:2px dashed var(--ink)}
.date29{display:inline-block;align-self:flex-start;font-family:var(--display);font-weight:900;font-stretch:112%;font-size:22px;background:var(--on-hero);color:var(--hero);padding:4px 14px;border-radius:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Detalle por votación */
.vcard{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.vcard h3{font-size:19px}
.meta{font-size:13px;color:var(--muted)}
.you{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:800;padding:3px 12px;border-radius:999px;align-self:flex-start;border:2px solid var(--ink)}
.you.S{background:var(--yes);color:var(--yes-ink)} .you.N{background:var(--no);color:var(--no-ink)} .you.X{background:var(--abs);color:var(--abs-ink);border-color:transparent}
.group{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:start;font-size:14px}
.group > span{font-weight:800;padding-top:3px;color:var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{padding:2px 10px;border-radius:999px;font-weight:700;font-size:13px;border:2px solid var(--ink)}
.pill.S{background:var(--yes);color:var(--yes-ink)} .pill.N{background:var(--no);color:var(--no-ink)} .pill.A{background:var(--abs);color:var(--abs-ink);border-color:transparent} .pill.U{border:2px dashed var(--line);color:var(--muted)}
.pill.mine{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}

ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.vote{background:var(--hero);color:var(--on-hero);border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:12px}
.copy{font-size:12px;color:var(--muted);text-align:center;padding-top:16px;letter-spacing:.02em}
.vote .big{font-family:var(--display);font-weight:900;font-stretch:118%;font-size:56px;line-height:1}

/* Cómo funciona (infografía) */
.num{font-family:var(--display);font-weight:900;font-stretch:112%;font-variant-numeric:tabular-nums;line-height:.9;letter-spacing:-.01em}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--on-hero-muted)}
.eyebrow.dark{color:var(--muted)}
.ih{background:var(--hero);color:var(--on-hero);border-radius:28px;padding:28px 24px 30px;display:flex;flex-direction:column;gap:14px}
.ih h1{font-size:clamp(30px,8.6vw,38px);line-height:1.08;font-weight:800}
.ih u{text-decoration-thickness:3px;text-underline-offset:5px}
.isec{display:flex;flex-direction:column;gap:14px;padding-top:12px;border-top:2px solid var(--ink)}
.isec h2{font-size:24px;line-height:1.15;font-weight:800}
.funnel{background:var(--surface);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px}
.frow{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:end}
.frow .num{font-size:44px}
.frow span{font-size:14px;line-height:1.35;color:var(--muted);padding-bottom:2px}
.fbar{height:20px;border-radius:6px;background:var(--tint);box-shadow:inset 0 0 0 2px var(--ink);overflow:hidden;margin-bottom:10px}
.fbar.all{background:var(--muted)}
.fbar.few i{display:block;height:100%;min-width:6px;background:var(--ink)}
.fnote{font-size:12px;color:var(--muted);margin-top:-2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--surface);border-radius:16px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px}
.stats .num{font-size:34px}
.stats .num small{font-size:16px;font-weight:800;margin-left:3px;letter-spacing:0}
.stats span{font-size:13px;font-weight:700;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:48px 1fr;gap:14px;position:relative;padding-bottom:18px}
.step.last{padding-bottom:0}
.step:not(.last)::before{content:"";position:absolute;left:23px;top:48px;bottom:0;width:2px;background:var(--ink)}
.dot{width:48px;height:48px;border-radius:24px;background:var(--ink);color:var(--surface);display:grid;place-items:center}
.dot.open{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.dot svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.step div{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.step b{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.15}
.step div span{font-size:15px;line-height:1.4;color:var(--muted)}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sc{border-radius:18px;padding:16px 14px 14px;display:flex;flex-direction:column;gap:10px;min-height:128px}
.sc .num{font-size:52px}
.sc span{font-size:13px;font-weight:700;line-height:1.3}
.sc.s1{background:var(--yes);color:var(--yes-ink)}
.sc.s2{background:var(--abs);color:var(--abs-ink)}
.sc.s3{background:var(--no);color:var(--no-ink);box-shadow:inset 0 0 0 2px var(--ink)}
.x2{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:14px 16px}
.x2 .num{font-size:30px}
.x2 span{font-size:14px;line-height:1.4;color:var(--muted)}
.trust{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;background:var(--surface);border-radius:var(--r);overflow:hidden}
.trust li{display:grid;grid-template-columns:28px 1fr;gap:14px;align-items:start;padding:14px 18px;font-size:15px;line-height:1.4}
.trust li + li{border-top:1px solid var(--line)}
.ti svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.acc{background:var(--surface);border-radius:16px;padding:0 18px}
.acc summary{min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:800;cursor:pointer;list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-family:var(--display);font-weight:800;font-size:24px;line-height:1}
.acc[open] summary::after{content:"–"}
.acc > ul,.acc > p{padding-bottom:16px;font-size:15px;line-height:1.45}
.iend{background:var(--hero);color:var(--on-hero);border-radius:28px;padding:26px 24px 24px;display:flex;flex-direction:column;gap:18px}
.iend p{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.15}
.cta.inv{background:var(--on-hero);color:var(--hero)}
.homeinfo{min-height:52px}

/* Logo A2: ATRÉVETE con tilde-check + casilla 29-N */
.logo{display:inline-flex;align-items:flex-end;gap:.2em;font-family:var(--display);font-weight:900;font-stretch:118%;font-size:clamp(28px,calc((min(100vw,480px) - 80px) / 8.1),52px);line-height:1;letter-spacing:-.03em;white-space:nowrap;padding-top:.2em}
.logo .w{display:inline-flex;align-items:flex-end}
.logo .e{position:relative;display:inline-block}
.logo .e svg{position:absolute;left:.12em;top:-.17em;width:.42em;height:.28em;overflow:visible;fill:none;stroke:currentColor;stroke-width:9;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:8}
.logo .box{flex:0 0 .93em;width:.93em;height:.93em;box-sizing:border-box;border:.07em solid currentColor;display:flex;align-items:center;justify-content:center;margin-bottom:.05em;letter-spacing:-.01em}
.logo .box span{font-size:.27em;font-stretch:100%}

/* Compartir */
.fmt{display:flex;gap:8px;justify-content:center}
.share img{display:block;width:62%;max-width:260px;height:auto;aspect-ratio:9/16;margin:4px auto 6px;border-radius:14px;background:#F4F4F2;box-shadow:0 0 0 1px var(--line)}
.dare{border:2px solid var(--ink);border-radius:var(--r);padding:16px 18px;font-size:16px;line-height:1.45;background:var(--surface)}
</style>

<div class="app" id="app"></div>

<script>
const PARTIES = [
  ["psoe","PSOE"],["pp","PP"],["vox","Vox"],["sumar","Sumar"],["erc","ERC"],["junts","Junts"],
  ["bildu","EH Bildu"],["pnv","PNV"],["podemos","Podemos"],["bng","BNG"],["compromis","Compromís"],
  ["cc","Coalición Canaria"],["upn","UPN"]
];
const TOPICS = {
  viv:{name:"Vivienda", ico:"home", tint:"--tint"},
  tra:{name:"Trabajo", ico:"clock", tint:"--tint"},
  pen:{name:"Pensiones", ico:"sprout", tint:"--tint"},
  imp:{name:"Impuestos", ico:"coin", tint:"--tint"},
  ene:{name:"Energía y medio ambiente", ico:"bolt", tint:"--tint"},
  inm:{name:"Inmigración", ico:"globe", tint:"--tint"},
  ter:{name:"Modelo territorial", ico:"scale", tint:"--tint"},
  igu:{name:"Igualdad", ico:"equal", tint:"--tint"},
  der:{name:"Derechos", ico:"heart", tint:"--tint"},
  fam:{name:"Familia y juventud", ico:"family", tint:"--tint"},
  trn:{name:"Transporte", ico:"bus", tint:"--tint"},
  ins:{name:"Instituciones", ico:"ballot", tint:"--tint"},
  seg:{name:"Seguridad y justicia", ico:"shield", tint:"--tint"},
  mem:{name:"Memoria histórica", ico:"doc", tint:"--tint"},
  san:{name:"Sanidad", ico:"health", tint:"--tint"}
};
const CET = "https://www.elcongresoentumano.es/ley/";
// Votos en orden: psoe pp vox sumar erc junts bildu pnv podemos bng compromis cc upn
// S sí · N no · A abstención · ? sin dato fiable o partido dividido

};

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const TAG = {S:["S","Sí"], N:["N","No"], A:["A","Abs."]};
const tag = v => `<span class="tag ${TAG[v][0]}">${TAG[v][1]}</span>`;
const shuffle = a => { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };

// Una pregunta por tema que aún no haya salido, en orden de temas aleatorio
function newRound(){
  const ids = [];
  shuffle(TKEYS).forEach(t => {
    const free = BANK.filter(q => q.t === t && !st.asked.includes(q.id));
    if (free.length) ids.push(shuffle(free)[0].id);
  });
  st.round = ids; st.i = 0; st.rounds++; st.more = false;
}
const canRefine = () => TKEYS.some(t => BANK.some(q => q.t === t && !st.asked.includes(q.id)));

function score(){
  return PARTIES.map(([k, name], p) => {
    let got = 0, max = 0, same = 0, n = 0; const diff = [];
    st.asked.forEach(id => {
      const q = BANK[id], a = st.ans[id], pv = q.v[p];
      if ((a !== "S" && a !== "N") || pv === "?") return;
      const w = st.imp[id] ? 2 : 1;
      got += (pv === a ? 1 : pv === "A" ? .5 : 0) * w; max += w; n++;
      if (pv === a) same++; else diff.push({q, pv, a});
    });
    return {name, pct: max ? Math.round(100 * got / max) : 0, diff, same, n};
  }).sort((a, b) => b.pct - a.pct);
}

function result(){
  const answered = st.asked.filter(id => st.ans[id] === "S" || st.ans[id] === "N").length;

  const r = score(), top = r[0], m = r.find(x => x.name === st.mine);

  const refine = canRefine()

    <img id="shareimg" alt="Imagen para compartir: Me he atrevido, con tu porcentaje de coincidencia" width="1080" height="1920">

  </div>
  <div class="card">
    <h3>Todos los partidos</h3>
    <div class="rank">${r.map((x,k)=>`
      <div class="rrow${x.pct===top.pct?" first":""}${x.name===st.mine?" mine":""}">
        <span class="n">${k+1}</span><span class="nm">${esc(x.name)}${x.name===st.mine?"<small>tu elección</small>":""}</span><span class="pc">${x.pct}%</span>
        <div class="bar" role="img" aria-label="${esc(x.name)}: ${x.pct}%"><i style="width:${x.pct}%"></i></div>
      </div>`).join("")}</div>
    <p class="small muted">Basado en tus ${answered} respuestas a favor o en contra. <button class="link small" data-calc>¿Cómo se calcula?</button></p>
  </div>

function finishRound(){
  st.round.forEach(id => { if (!st.asked.includes(id)) st.asked.push(id); });
  go("result");
}
function bind(){
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  app.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { st.mine = PICK[+b.dataset.pick]; render(); });
  const s = app.querySelector("[data-start]"); if (s) s.onclick = () => { newRound(); go("quiz"); };
  const p = app.querySelector("[data-prev]"); if (p) p.onclick = () => {
    st.more = false;
    if (st.i > 0) { st.i--; render(); }
    else if (st.rounds > 1) go("result");
    else go("pick");
  };
  const m = app.querySelector("[data-more]"); if (m) m.onclick = () => { st.more = !st.more; render(); };
  app.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const id = st.round[st.i];
    st.ans[id] = b.dataset.a;
    if (b.dataset.a === "X") st.imp[id] = false;
    render();
    setTimeout(() => { st.more = false; if (st.i < st.round.length - 1) { st.i++; render(); window.scrollTo({top:0}); } else finishRound(); }, 260);
  });
  const imp = app.querySelector("#imp"); if (imp) imp.onchange = e => { st.imp[st.round[st.i]] = e.target.checked; };
  const cc = app.querySelector("[data-calc]"); if (cc) cc.onclick = () => { go("info"); const t = document.getElementById("calc"); if (t) t.scrollIntoView({block:"start"}); };
  const sh = app.querySelector("[data-share]"); if (sh) sh.onclick = doShare;
  app.querySelectorAll("[data-fmt]").forEach(b => b.onclick = () => { SHARE.fmt = b.dataset.fmt; prepareShare(); });
  const dl = app.querySelector("[data-dl]"); if (dl) dl.onclick = doDownload;
  const cp = app.querySelector("[data-copy]"); if (cp) cp.onclick = doCopy;
  if (st.screen === "result") prepareShare();
  const rf = app.querySelector("[data-refine]"); if (rf) rf.onclick = () => { newRound(); go("quiz"); };
  app.querySelectorAll("[data-restart]").forEach(b => b.onclick = () => {
    Object.assign(st, {mine:null, round:[], i:0, asked:[], ans:{}, imp:{}, more:false, rounds:0}); go("home");
  });
}

    : `Me he atrevido: mi afinidad más alta con un partido es del ${d.pct}%. Ahora decido con datos.`;
  return `${core} ¿Te atreves tú? #MeHeAtrevido #Atrévete29N ${shareURL(d)}`;
}

async function drawShareCard(d, fmt){
  try { await Promise.all([document.fonts.load("900 100px Archivo"), document.fonts.load("800 40px 'Public Sans'"), document.fonts.load("400 40px 'Public Sans'")]); } catch (e) {}
  const story = fmt !== "feed";
  // Story/TikTok 9:16: zona segura x 100–930 (TikTok tapa ~150 px a la derecha), y 250–1535 (TikTok tapa el 20 % inferior).
  // Publicación 4:5: márgenes de 100 px y nada importante en el 10 % superior e inferior (recorte 3:4 de la cuadrícula).
  const W = 1080, H = story ? 1920 : 1350, L = story ? 140 : 130, R = story ? 870 : 950, CW = R - L;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const c = cv.getContext("2d");
  const disp = (w, px, stretch) => { c.font = `${w} ${px}px Archivo, 'Arial Narrow', sans-serif`; try { c.fontStretch = stretch || "expanded"; } catch (e) {} c.letterSpacing = `${-0.03 * px}px`; };
  const body = (w, px) => { c.font = `${w} ${px}px 'Public Sans', 'Segoe UI', sans-serif`; try { c.fontStretch = "normal"; } catch (e) {} c.letterSpacing = "0px"; };
  const fit = (txt, w, px, maxW) => { let s = px; while (s > 20) { disp(w, s); if (c.measureText(txt).width <= maxW) break; s -= 2; } return s; };
  const WHITE = "#111111", GREY = "#5C5C5C", DIM = "#7A7A7A";   // tinta sobre papel (nombres heredados)
  c.fillStyle = "#F4F4F2"; c.fillRect(0, 0, W, H);
  c.textBaseline = "alphabetic"; c.textAlign = "left";

  // Marco de papeleta: decorativo, puede entrar en las zonas tapadas
  c.strokeStyle = "#D2D2D0"; c.lineWidth = 3; c.strokeRect(56, 56, W - 112, H - 112);

  // Logo ATRÉVETE + tilde-check + casilla 29-N
  const logoW = px => { disp(900, px); return c.measureText("ATRVETE").width + c.measureText("E").width + 1.13 * px; };
  const logo = (x, base, px) => {
    c.fillStyle = WHITE; c.strokeStyle = WHITE; disp(900, px);
    const wA = c.measureText("ATR").width, wE = c.measureText("E").width, wV = c.measureText("VETE").width;
    c.fillText("ATR", x, base); c.fillText("E", x + wA, base); c.fillText("VETE", x + wA + wE, base);
    const tx = x + wA + 0.12 * px, ty = base - 1.005 * px, tw = 0.42 * px, th = 0.28 * px;
    c.lineWidth = 0.09 * px; c.lineJoin = "miter"; c.lineCap = "butt";
    c.beginPath(); c.moveTo(tx + tw * 3/42, ty + th * 13/28); c.lineTo(tx + tw * 15/42, ty + th * 24/28); c.lineTo(tx + tw * 40/42, ty + th * 3/28); c.stroke();
    const bx = x + wA + wE + wV + 0.2 * px, bs = 0.93 * px, bb = base + 0.115 * px, bw = 0.07 * px;
    c.lineWidth = bw; c.strokeRect(bx + bw / 2, bb - bs + bw / 2, bs - bw, bs - bw);
    disp(900, 0.29 * px, "normal"); c.letterSpacing = "0px"; c.textAlign = "center";
    c.fillText("29-N", bx + bs / 2, bb - bs / 2 + 0.1 * px); c.textAlign = "left";
  };

  const lines = d.mode === "mine" ? ["El partido que pensaba votar", "coincide conmigo en un"] : ["Mi afinidad más alta", "con un partido es del"];
  const verdict = d.mode === "mine" ? (d.confirmed ? "El test lo confirma." : "El test me ha hecho pensar.") : "Ahora decido con datos.";
  const pct = `${d.pct}%`;

  if (story) {
    // 1º el mensaje personal (primer vistazo, bajo los 250 px tapados); la marca firma el cierre
    const hs = fit("ATREVIDO", 900, 160, CW);
    c.fillStyle = WHITE; disp(900, hs); c.fillText("ME HE", L, 410); c.fillText("ATREVIDO", L, 410 + hs * 0.96);
    const rule = 410 + hs * 0.96 + 64; c.fillRect(L, rule, CW, 6);
    body(700, 42); c.fillStyle = GREY; c.fillText(lines[0], L, rule + 86); c.fillText(lines[1], L, rule + 138);
    const ps = fit(pct, 900, 250, CW); c.fillStyle = WHITE; disp(900, ps); const yb = rule + 138 + ps * 0.9 + 24; c.fillText(pct, L - 6, yb);
    body(400, 38); if (d.n) c.fillText(`Votó como yo en ${d.same} de ${d.n} votaciones.`, L, yb + 76);
    body(800, 38); c.fillText(verdict, L, yb + 130);
    body(400, 36); c.fillStyle = GREY; c.fillText("Mi voto sigue siendo secreto.", L, yb + 182);
    // Cierre con la firma; todo por encima de y = 1535 (TikTok tapa el 20 % inferior)
    // Llamada a la acción: la pregunta y dónde responderla
    c.fillStyle = WHITE; c.fillRect(L, 1262, 120, 6);
    body(800, 54); c.fillText("¿Te atreves?", L, 1340);
    body(400, 38); c.fillStyle = GREY; c.fillText("Ahora tú:", L, 1396);
    body(800, 38); c.fillStyle = WHITE; const hx = L + (body(400, 38), c.measureText("Ahora tú: ").width); body(800, 38); c.fillText("atrevete29n.netlify.app", hx, 1396);
    // Firma: marca a la izquierda, comunidad y autoría a la derecha
    c.fillStyle = "#D2D2D0"; c.fillRect(L, 1440, CW, 2);
    logo(L, 1516, 44);
    body(800, 30); c.fillStyle = WHITE; c.textAlign = "right"; c.fillText("#MeHeAtrevido", R, 1500);
    body(400, 22); c.fillStyle = DIM; c.fillText("© 2026 unoparatodos", R, 1530); c.textAlign = "left";
  } else {
    const hs = fit("ATREVIDO", 900, 150, CW);
    c.fillStyle = WHITE; disp(900, hs); c.fillText("ME HE", L, 262); c.fillText("ATREVIDO", L, 262 + hs * 0.96);
    const rule = 262 + hs * 0.96 + 50; c.fillRect(L, rule, CW, 6);
    body(700, 36); c.fillStyle = GREY; c.fillText(lines[0], L, rule + 66); c.fillText(lines[1], L, rule + 112);
    const ps = fit(pct, 900, 200, CW * 0.58); c.fillStyle = WHITE; disp(900, ps); const yb = rule + 112 + ps * 0.9 + 20; c.fillText(pct, L - 5, yb);
    disp(900, ps); const pw = c.measureText(pct).width; const xr = L + pw + 40;
    body(400, 30); c.fillStyle = WHITE;
    if (d.n) { c.fillText(`Votó como yo en`, xr, yb - 100); c.fillText(`${d.same} de ${d.n} votaciones.`, xr, yb - 60); }
    body(800, 30); const vw = verdict.split(" "); const mid = Math.ceil(vw.length / 2);
    c.fillText(vw.slice(0, mid).join(" "), xr, yb - 10); c.fillText(vw.slice(mid).join(" "), xr, yb + 28);
    body(400, 30); c.fillStyle = GREY; c.fillText("Mi voto sigue siendo secreto.", L, yb + 78);
    // Cierre con la firma, por encima del 10 % inferior
    c.fillStyle = WHITE; c.fillRect(L, 950, 110, 5);
    body(800, 44); c.fillText("¿Te atreves?", L, 1012);
    body(400, 32); c.fillStyle = GREY; c.fillText("Ahora tú:", L, 1060);
    const hx = L + c.measureText("Ahora tú: ").width; body(800, 32); c.fillStyle = WHITE; c.fillText("atrevete29n.netlify.app", hx, 1060);
    c.fillStyle = "#D2D2D0"; c.fillRect(L, 1096, CW, 2);
    logo(L, 1166, 38);
    body(800, 26); c.fillStyle = WHITE; c.textAlign = "right"; c.fillText("#MeHeAtrevido", R, 1152);
    body(400, 20); c.fillStyle = DIM; c.fillText("© 2026 unoparatodos", R, 1180); c.textAlign = "left";
  }
  return cv;
}

let SHARE = {cv:null, d:null, fmt:"story"};
async function prepareShare(){
  const img = document.getElementById("shareimg"); if (!img) return;
  const d = shareData(); const fmt = SHARE.fmt || "story"; const cv = await drawShareCard(d, fmt);
  SHARE = {cv, d, fmt}; img.src = cv.toDataURL("image/png");
  img.style.aspectRatio = fmt === "story" ? "9/16" : "4/5";
  document.querySelectorAll("[data-fmt]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.fmt === fmt)));
}
function shareMsg(t){ const el = document.getElementById("sharemsg"); if (el) el.textContent = t; }
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) { const ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); let ok=false; try { ok = document.execCommand("copy"); } catch (e2) {} ta.remove(); return ok; }
}
async function doShare(){
  if (!SHARE.cv) return;
  const text = shareText(SHARE.d);
  // Instagram y TikTok solo aceptan la imagen sola: si se envía con texto, desaparecen del menú.
  // Por eso copiamos antes el texto para pegarlo después, y compartimos únicamente la imagen.
  const copied = await copyText(text);
  try {
    const blob = await new Promise(r => SHARE.cv.toBlob(r, "image/png"));
    const file = new File([blob], "me-he-atrevido.png", {type:"image/png"});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      await navigator.share({files:[file]});
      shareMsg(copied ? "Texto con el enlace copiado: pégalo en tu publicación o en un sticker de enlace." : "Listo. Añade el enlace atrevete29n.netlify.app en tu publicación.");
      return;
    }
    doDownload();
    shareMsg(copied ? "Imagen descargada y texto con el enlace copiado: súbela a la red que quieras y pega el texto." : "Imagen descargada: súbela a la red que quieras con el enlace atrevete29n.netlify.app.");
  } catch (e) {
    if (e && e.name === "AbortError") return;
    shareMsg("No se ha podido abrir el menú de compartir. Mantén pulsada la imagen para guardarla y súbela desde la app que quieras.");
  }
}
function doDownload(){
  if (!SHARE.cv) return;
  const a = document.createElement("a"); a.href = SHARE.cv.toDataURL("image/png"); a.download = SHARE.fmt === "feed" ? "me-he-atrevido-publicacion.png" : "me-he-atrevido-stories.png";
  document.body.appendChild(a); a.click(); a.remove();
}
async function doCopy(){ const ok = await copyText(shareText(SHARE.d || shareData())); shareMsg(ok ? "Texto y enlace copiados." : "No se ha podido copiar. Mantén pulsado para seleccionarlo."); }

render();
</script>
